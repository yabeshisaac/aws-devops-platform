name: Deploy AWS DevOps Platform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aws-devops-platform-dev
  ECS_CLUSTER: aws-devops-platform-dev-cluster
  ECS_SERVICE: aws-devops-platform-dev-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Checkout source code
      # -----------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------
      # Authenticate GitHub Actions with AWS
      # -----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------
      # Login to Amazon ECR
      # -----------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------
      # Build Docker image
      # -----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            ./app

      # -----------------------------------------
      # Tag image for ECR
      # -----------------------------------------
      - name: Tag Docker image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}

          docker tag \
            $ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_URI:$IMAGE_TAG

          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV

      # -----------------------------------------
      # Push image to ECR
      # -----------------------------------------
      - name: Push Docker image
        run: |
          docker push $ECR_URI:$IMAGE_TAG

      # -----------------------------------------
      # Deploy updated container
      # -----------------------------------------
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      # -----------------------------------------
      # Wait for ECS deployment
      # -----------------------------------------
      - name: Wait for ECS service
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION

      # -----------------------------------------
      # Deployment verification
      # -----------------------------------------
      - name: Verify deployment
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION \
            --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}" \
            --output table