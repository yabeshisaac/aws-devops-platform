name: Deploy AWS DevOps Platform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aws-devops-platform-dev
  ECS_CLUSTER: aws-devops-platform-dev-cluster
  ECS_SERVICE: aws-devops-platform-dev-service
  TASK_FAMILY: aws-devops-platform-dev
  CONTAINER_NAME: app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Checkout source code
      # -----------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------
      # Authenticate GitHub Actions with AWS OIDC
      # -----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------
      # Login to Amazon ECR
      # -----------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------
      # Get ECR repository URI
      # -----------------------------------------
      - name: Set ECR image URI
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}
          IMAGE_URI=${ECR_URI}:${IMAGE_TAG}

          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # -----------------------------------------
      # Build Docker image
      # -----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_URI \
            ./app

      # -----------------------------------------
      # Push immutable SHA-tagged image to ECR
      # -----------------------------------------
      - name: Push Docker image
        run: |
          docker push $IMAGE_URI

      # -----------------------------------------
      # Download current ECS task definition
      # -----------------------------------------
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --region $AWS_REGION \
            --query taskDefinition \
            > current-task-definition.json

      # -----------------------------------------
      # Create deployable task definition
      # Replace image with this commit's SHA image
      # -----------------------------------------
      - name: Create new task definition
        run: |
          jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg CONTAINER "$CONTAINER_NAME" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |= map(
              if .name == $CONTAINER
              then .image = $IMAGE
              else .
              end
            )
            ' \
            current-task-definition.json \
            > new-task-definition.json

      # -----------------------------------------
      # Register new ECS task definition revision
      # -----------------------------------------
      - name: Register new task definition
        run: |
          NEW_TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --region $AWS_REGION \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "NEW_TASK_DEFINITION_ARN=$NEW_TASK_DEFINITION_ARN" >> $GITHUB_ENV

          echo "Registered task definition:"
          echo "$NEW_TASK_DEFINITION_ARN"

      # -----------------------------------------
      # Deploy exact task definition revision
      # -----------------------------------------
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $NEW_TASK_DEFINITION_ARN \
            --region $AWS_REGION

      # -----------------------------------------
      # Wait for ECS rolling deployment
      # -----------------------------------------
      - name: Wait for ECS service
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION

      # -----------------------------------------
      # Verify deployment
      # -----------------------------------------
      - name: Verify deployment
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION \
            --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition}" \
            --output table